[project]
name = "healf-agent"
version = "0.1.0"
description = "Healf Product Intelligence Agent"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39.0",
    "openai>=1.40.0",
    "google-genai>=0.3.0",
    "httpx>=0.27.0",
    "selectolax>=0.3.21",
    "playwright>=1.45.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "hdbscan>=0.8.36",
    "streamlit>=1.36.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "fastmcp>=0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
